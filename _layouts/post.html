<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.title }} - {{ site.title }}">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="shortcut icon" href="{{ site.baseurl }}/images/wuxudong.ico">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap">
</head>
<body>
  {% include nav.html %}
  
  <main class="main-content">
    <section class="section">
      <div class="container">
        <div class="post-content">
          <div class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">
              <time>{{ page.date | date: "%B %d, %Y" }}</time>
              {% if page.tags %}
              · 
              {% for tag in page.tags %}
              <span class="tag">{{ tag }}</span>
              {% endfor %}
              {% endif %}
            </div>
          </div>
          <div class="post-body">
            {{ content }}
          </div>
          <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
            <a href="{{ site.baseurl }}/blog" style="color: var(--primary); font-weight: 500;">
              <i class="fas fa-arrow-left"></i> Back to Blog
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  {% include footer.html %}
  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
