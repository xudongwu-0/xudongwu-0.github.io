<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1010" viewBox="0 0 760 1010" role="img" aria-labelledby="title description">
  <title id="title">JoMoHa: How should we train the model and its harness together?</title>
  <desc id="description">A research poster about JoMoHa. After an initial improvement from 83.0% to 90.5%, alternating training fell to 31.5% on ALFWorld. JoMoHa trains the Engineer and Solver on the same task attempt using a shared reward and separate collaboration-aware critics. It reaches 97.0% on ALFWorld and averages 70.3% over three benchmarks.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#292d30"/>
      <stop offset=".65" stop-color="#14171a"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#fff" stroke-opacity=".065"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#9bdfcb"/>
    </marker>
  </defs>
  <rect width="760" height="1010" fill="url(#background)"/>
  <rect width="760" height="1010" fill="url(#grid)"/>
  <path d="M22 37V22H37 M723 22h15v15 M22 973v15h15 M723 988h15v-15" fill="none" stroke="#697175"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <g fill="#f3f5f5" font-size="17" font-weight="650">
      <text x="50" y="67">The University of Hong Kong</text>
      <text x="308" y="67">Salesforce</text>
    </g>
    <path d="M289 46v28 M50 97h660" fill="none" stroke="#606769"/>
    <text x="50" y="139" fill="#a5e5d2" font-size="14" font-weight="700" letter-spacing="3">RESEARCH SPOTLIGHT / AGENT TRAINING</text>
    <text x="50" y="235" fill="#fff" font-size="84" font-weight="750">JoMoHa</text>
    <g fill="#f3f5f5" font-size="27" font-weight="650">
      <text x="52" y="281">How should we train the model</text>
      <text x="52" y="314">and its harness together?</text>
    </g>
    <text x="52" y="355" fill="#bac5c7" font-size="17">Joint Model&#8211;Harness Optimization with Reinforcement Learning</text>

    <g fill="none" stroke="#9bdfcb" stroke-width="1.5">
      <rect x="525" y="171" width="185" height="127"/>
      <path d="M589 210h56 M675 227v31h-92v-30" marker-end="url(#arrow)"/>
      <rect x="540" y="194" width="49" height="32" fill="#242b2d"/>
      <rect x="646" y="194" width="49" height="32" fill="#242b2d"/>
    </g>
    <g fill="#e1fff5" font-family="monospace" text-anchor="middle" font-weight="700">
      <text x="564.5" y="215" font-size="16">E</text>
      <text x="670.5" y="215" font-size="16">S</text>
      <text x="620" y="282" font-size="11" letter-spacing="1">SHARED REWARD</text>
    </g>

    <g fill="#a5e5d2" font-size="13" font-weight="700" letter-spacing="2">
      <text x="50" y="426">01 / THE PROBLEM</text>
      <text x="50" y="574">02 / OUR APPROACH</text>
      <text x="50" y="766">03 / RESULTS</text>
    </g>
    <path d="M232 421h478 M235 569h475 M180 761h530" fill="none" stroke="#505758"/>
    <text x="50" y="478" fill="#fff" font-size="29" font-weight="700">83.0% &#8594; 90.5% &#8594; <tspan fill="#ffb5a8">31.5%</tspan></text>
    <text x="50" y="516" fill="#d0d6d6" font-size="17">Alternating training on ALFWorld first helped, then broke down.</text>

    <g fill="#d0d6d6" font-size="18">
      <text x="50" y="616">The Engineer writes the harness. The Solver acts under it.</text>
      <text x="50" y="647">Both learn from the same task reward, with separate critics</text>
      <text x="50" y="678">that account for how the two policies worked together.</text>
    </g>
    <g fill="none" stroke="#596466">
      <rect x="50" y="702" width="151" height="26"/>
      <rect x="212" y="702" width="143" height="26"/>
      <rect x="366" y="702" width="242" height="26"/>
    </g>
    <g fill="#e0e8e7" font-family="monospace" font-size="11" letter-spacing=".8" text-anchor="middle">
      <text x="125.5" y="719">JOINT TRAINING</text>
      <text x="283.5" y="719">SHARED REWARD</text>
      <text x="487" y="719">COLLABORATION-AWARE CRITICS</text>
    </g>

    <rect x="50" y="791" width="660" height="117" fill="#111619" stroke="#596466"/>
    <path d="M51 791v117 M380 809v81" fill="none" stroke="#9bdfcb"/>
    <g fill="#fff" font-size="37" font-weight="750">
      <text x="73" y="846">97.0%</text>
      <text x="403" y="846">70.3%</text>
    </g>
    <g fill="#c6d1d1" font-size="17">
      <text x="73" y="879">ALFWorld success</text>
      <text x="403" y="879">Average across three benchmarks</text>
    </g>
    <path d="M50 941h660" fill="none" stroke="#505758"/>
    <text x="50" y="967" fill="#c4cece" font-size="14">Xudong Wu, Guangchen Lan, Mingqi Yuan, and Jiayu Chen</text>
    <text x="710" y="967" fill="#a5e5d2" font-family="monospace" font-size="12" text-anchor="end">arXiv:2611.11499</text>
  </g>
</svg>
