<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title description">
  <title id="title">JoMoHa: One task attempt, two policies learning together</title>
  <desc id="description">On ALFWorld, long-phase alternating training rose from 83.0 percent to 90.5 percent, then fell to 31.5 percent. In JoMoHa, the Engineer writes a harness and the Solver acts under it. A shared task reward and separate collaboration-aware critics train both policies. JoMoHa reaches 97.0 percent on ALFWorld and averages 70.3 percent across three benchmarks.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b182c"/>
      <stop offset="1" stop-color="#142d47"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#87caff"/>
    </marker>
  </defs>
  <rect width="760" height="530" rx="18" fill="url(#background)"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="34" y="46" fill="#8bd6ff" font-size="17" font-weight="700" letter-spacing="2">JOMOHA / RESEARCH SNAPSHOT</text>
    <text x="34" y="98" fill="#fff" font-size="39" font-weight="750">One task attempt,</text>
    <text x="34" y="143" fill="#fff" font-size="39" font-weight="750">two policies learning together.</text>

    <rect x="34" y="172" width="692" height="90" rx="12" fill="#292942"/>
    <text x="54" y="201" fill="#ffb5a5" font-size="17" font-weight="700" letter-spacing="1">ALTERNATING TRAINING / ALFWORLD</text>
    <text x="54" y="239" fill="#fff" font-size="27" font-weight="700">83.0% &#8594; 90.5% &#8594; <tspan fill="#ffb5a5">31.5%</tspan></text>

    <rect x="34" y="278" width="692" height="148" rx="12" fill="#1e3c56"/>
    <text x="54" y="308" fill="#a5e5ff" font-size="17" font-weight="700" letter-spacing="1">JOMOHA / JOINT REINFORCEMENT LEARNING</text>
    <g fill="#fff" font-size="22" font-weight="700">
      <text x="136" y="353" text-anchor="middle">Engineer</text>
      <text x="380" y="353" text-anchor="middle">Solver</text>
      <text x="620" y="353" text-anchor="middle">Task reward</text>
    </g>
    <g fill="#c3dcee" font-size="17" text-anchor="middle">
      <text x="136" y="377">Writes the harness</text>
      <text x="380" y="377">Acts under it</text>
      <text x="620" y="377">Trains both policies</text>
    </g>
    <path d="M225 347h73 M461 347h75" fill="none" stroke="#87caff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="380" y="407" text-anchor="middle" fill="#a5e5ff" font-size="18" font-weight="600">Separate critics account for how the pair worked together.</text>

    <g font-weight="750" fill="#fff" font-size="35">
      <text x="34" y="478">97.0%</text>
      <text x="388" y="478">70.3%</text>
    </g>
    <g fill="#c3dcee" font-size="18">
      <text x="34" y="505">ALFWorld success</text>
      <text x="388" y="505">Average across three benchmarks</text>
    </g>
  </g>
</svg>
