<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title description">
  <title id="title">JoMoHa: How should we train the model and its harness together?</title>
  <desc id="description">Alternating model and harness updates can pull the pair out of sync. On ALFWorld, success rose from 83.0% to 90.5%, then fell to 31.5%. JoMoHa trains the Engineer and Solver on the same task attempt: the Engineer writes the harness, the Solver uses it, and both learn from the task reward with separate critics that account for the partner. JoMoHa reaches 97.0% on ALFWorld and averages 70.3% across three benchmarks.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#292d30"/>
      <stop offset=".65" stop-color="#14171a"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#fff" stroke-opacity=".065"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="#9bdfcb"/>
    </marker>
  </defs>
  <rect width="760" height="1320" fill="url(#background)"/>
  <rect width="760" height="1320" fill="url(#grid)"/>
  <path d="M22 37V22H37 M723 22h15v15 M22 1283v15h15 M723 1298h15v-15" fill="none" stroke="#697175"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <g fill="#f3f5f5" font-size="17" font-weight="650">
      <text x="50" y="67">The University of Hong Kong</text>
      <text x="308" y="67">Salesforce</text>
    </g>
    <path d="M289 46v28 M50 97h660" fill="none" stroke="#606769"/>
    <text x="50" y="139" fill="#a5e5d2" font-size="14" font-weight="700" letter-spacing="3">RESEARCH SPOTLIGHT / AGENT TRAINING</text>
    <text x="50" y="235" fill="#fff" font-size="84" font-weight="750">JoMoHa</text>
    <g fill="#f3f5f5" font-size="27" font-weight="650">
      <text x="52" y="281">How should we train the model</text>
      <text x="52" y="314">and its harness together?</text>
    </g>
    <text x="52" y="355" fill="#bac5c7" font-size="17">Joint Model&#8211;Harness Optimization with Reinforcement Learning</text>

    <g fill="none" stroke="#9bdfcb" stroke-width="1.5">
      <rect x="525" y="171" width="185" height="127"/>
      <path d="M589 210h56 M675 227v31h-92v-30" marker-end="url(#arrow)"/>
      <rect x="540" y="194" width="49" height="32" fill="#242b2d"/>
      <rect x="646" y="194" width="49" height="32" fill="#242b2d"/>
    </g>
    <g fill="#e1fff5" font-family="monospace" text-anchor="middle" font-weight="700">
      <text x="564.5" y="215" font-size="16">E</text>
      <text x="670.5" y="215" font-size="16">S</text>
      <text x="620" y="282" font-size="11" letter-spacing="1">SHARED REWARD</text>
    </g>

    <g fill="#a5e5d2" font-size="13" font-weight="700" letter-spacing="2">
      <text x="50" y="426">01 / ALTERNATING UPDATES CAN PULL THE PAIR OUT OF SYNC</text>
      <text x="50" y="606">02 / TRAIN BOTH ON THE SAME TASK ATTEMPT</text>
      <text x="50" y="1076">03 / RESULTS</text>
    </g>
    <path d="M552 421h158 M458 601h252 M180 1071h530" fill="none" stroke="#505758"/>
    <g fill="#d0d6d6" font-size="18">
      <text x="50" y="453">To improve both, a simple approach is to freeze the harness and</text>
      <text x="50" y="478">train the model, then switch. Each adapts to a partner that changes</text>
      <text x="50" y="503">in the next phase. Their performance together can collapse.</text>
    </g>
    <text x="50" y="547" fill="#fff" font-size="29" font-weight="700">83.0% &#8594; 90.5% &#8594; <tspan fill="#ffb5a8">31.5%</tspan></text>
    <text x="397" y="545" fill="#d0d6d6" font-size="15">ALFWorld success</text>

    <g fill="#d0d6d6" font-size="18">
      <text x="50" y="637">The Engineer writes a harness. The Solver uses it to do the task.</text>
      <text x="50" y="661">Both update from that run's reward instead of taking turns.</text>
      <text x="50" y="685">Each has its own critic: one accounts for the Solver using the</text>
      <text x="50" y="709">code, the other for the harness guiding the Solver's actions.</text>
    </g>
    <rect x="50" y="725" width="660" height="302" rx="6" fill="#fff"/>
    <image href="overview.png" x="86" y="728" width="588" height="296"/>
    <text x="50" y="1051" fill="#c4cece" font-size="14">JoMoHa training algorithm (paper Figure 3, CC BY 4.0)</text>

    <rect x="50" y="1101" width="660" height="117" fill="#111619" stroke="#596466"/>
    <path d="M51 1101v117 M380 1119v81" fill="none" stroke="#9bdfcb"/>
    <g fill="#fff" font-size="37" font-weight="750">
      <text x="73" y="1156">97.0%</text>
      <text x="403" y="1156">70.3%</text>
    </g>
    <g fill="#c6d1d1" font-size="17">
      <text x="73" y="1189">ALFWorld success</text>
      <text x="403" y="1189">Average across three benchmarks</text>
    </g>
    <path d="M50 1251h660" fill="none" stroke="#505758"/>
    <text x="50" y="1277" fill="#c4cece" font-size="14">Xudong Wu, Guangchen Lan, Mingqi Yuan, and Jiayu Chen</text>
    <text x="710" y="1277" fill="#a5e5d2" font-family="monospace" font-size="12" text-anchor="end">arXiv:2611.11499</text>
    <a href="https://github.com/xudongwu-0/coevolve" target="_blank" rel="noopener noreferrer">
      <text x="50" y="1297" fill="#a5e5d2" font-family="monospace" font-size="13" text-decoration="underline">github.com/xudongwu-0/coevolve</text>
    </a>
  </g>
</svg>
