name: DASE7506 leaderboard
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dase7506-leaderboard.yml'
      - 'scripts/dase7506/**'
      - 'courses/dase7506/arena.mjs'
      - 'courses/dase7506/projects.mjs'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: dase7506-leaderboard
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate scoring and review rules
        run: node --test scripts/dase7506/arena.test.mjs
      - name: Read submissions and instructor labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/dase7506/sync.mjs --ensure-labels
      - name: Save public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/dase7506/data/leaderboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DASE7506 leaderboard snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
